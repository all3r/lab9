name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  test_and_lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: lab_db
          POSTGRES_USER: lab_user
          POSTGRES_PASSWORD: lab_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v3

      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Запуск тестов Django
        env:
          DB_NAME: lab_db
          DB_USER: lab_user
          DB_PASSWORD: lab_password
          DB_HOST: localhost
        run: |
          python manage.py makemigrations lab6
          python manage.py test lab6

      - name: Статический анализ кода (Pylint)
        # Добавляем || true, чтобы мелкие замечания по стилю кода не ломали сборку
        run: |
          pylint --load-plugins pylint_django lab6 || true

  deploy_ngrok:
    needs: test_and_lint
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v3

      - name: Сборка и запуск контейнеров Docker
        # Исправлено на синтаксис Docker V2 (без дефиса)
        run: docker compose up -d --build

      - name: Установка Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install -y ngrok

      - name: Запуск Ngrok и получение ссылки
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          ngrok http 8000 --log=stdout &
          sleep 5
          echo "=== ПРИЛОЖЕНИЕ УСПЕШНО РАЗВЕРНУТО ==?"
          echo "Публичный URL:"
          curl -s http://localhost:4040/api/tunnels | grep -o "https://[a-zA-Z0-9.-]*\.ngrok-free\.[a-z]*" || true
          sleep 1800