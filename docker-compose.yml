version: '3.8'

services:
  web:
    build: .
    command: bash -c "python manage.py makemigrations lab6 && python manage.py migrate && gunicorn -b 0.0.0.0:8000 web_project.wsgi"
    ports:
      - "8000:8000"
    depends_on:
      - db
    # Передаем доступы в Django (чтобы settings.py их прочитал)
    environment:
      - DB_NAME=lab_db
      - DB_USER=lab_user
      - DB_PASSWORD=lab_password
      - DB_HOST=db

  db:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: lab_db
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: lab_password
    ports:
      - "5433:5432" # <-- Меняем левое число на 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data

# Обязательно объявляем том (volume) в конце файла
volumes:
  postgres_data: